# Prerelease (manual): cut a v<target>-rc.N prerelease with the full CI-built
# binary set on demand. Nothing here runs automatically -- trigger it yourself
# when you want an rc:
#
#   gh workflow run prerelease.yml                  # from main (post-merge rc)
#   gh workflow run prerelease.yml --ref <branch>   # from a branch (pre-merge snapshot)
#
# or use the Actions UI ("Run workflow"). Manual-only by design (2026-09-29, at
# the maintainer's request): publishing an rc automatically on every green main
# CI was noise -- most changes ship straight to a stable release, and small
# changes do not warrant the rc ceremony. Stable releases are cut with the
# maintainer's release flow; this workflow exists so an on-demand rc gets the
# same six-platform binary set without a local build.
#
# Version scheme: target version = the root VERSION value while v<VERSION> has
# not been released yet, otherwise VERSION patch+1 (rc numbering lives purely in
# tags; version files are never bumped here -- that is /bump's job).
name: prerelease

on:
  workflow_dispatch:

permissions:
  contents: write # push tag + create release

concurrency:
  group: prerelease
  cancel-in-progress: false # serialize; prevents rc number races

jobs:
  prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: rc numbering and notes need tag history
          fetch-tags: true
          persist-credentials: false

      - name: Resolve previous tag
        id: changes
        run: |
          set -euo pipefail
          PREV="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"

      - name: Derive next rc tag
        id: ver
        run: |
          set -euo pipefail
          V="$(tr -d 'v\n' < VERSION)"
          if [ -z "$V" ]; then
            echo "::error::root VERSION file is empty"
            exit 1
          fi
          # Target: VERSION itself while unreleased; patch+1 once v<VERSION> exists.
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null 2>&1; then
            TARGET="$(python3 -c "import re,sys;v=sys.argv[1];print(re.sub(r'(\d+)$',lambda m:str(int(m.group(1))+1),v))" "$V")"
          else
            TARGET="$V"
          fi
          LAST_N="$(git tag -l "v$TARGET-rc.*" | sed 's/.*-rc\.//' | sort -n | tail -1 || true)"
          N="$(( ${LAST_N:-0} + 1 ))"
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"
          echo "tag=v$TARGET-rc.$N" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies and hydrate model data
        run: |
          npm ci --ignore-scripts
          npm run hydrate:model-data

      - name: Build binaries and npm-layout tarball
        run: |
          ./scripts/build-binaries.sh --skip-install --offline-model-data --out binaries

      - name: Smoke-test linux-x64 binary
        run: |
          set -euo pipefail
          mkdir -p smoke
          tar -xzf binaries/pi-linux-x64.tar.gz -C smoke
          smoke/pi/pi --version
          smoke/pi/pi --help > /dev/null

      - name: Assemble release payload
        run: |
          set -euo pipefail
          mkdir -p dist
          cp binaries/pi-darwin-arm64.tar.gz \
                binaries/pi-darwin-x64.tar.gz \
                binaries/pi-linux-x64.tar.gz \
                binaries/pi-linux-arm64.tar.gz \
                binaries/pi-windows-x64.zip \
                binaries/pi-windows-arm64.zip \
                dist/
          cp binaries/pi-coding-agent-*.tgz dist/
          (
            cd dist
            sha256sum \
              pi-darwin-arm64.tar.gz \
              pi-darwin-x64.tar.gz \
              pi-linux-x64.tar.gz \
              pi-linux-arm64.tar.gz \
              pi-windows-x64.zip \
              pi-windows-arm64.zip \
              pi-coding-agent-*.tgz > SHA256SUMS
          )

      - name: Tag and publish prerelease
        run: |
          set -euo pipefail
          # Annotated tags need a committer identity; runners have none by default
          # (run 35712627220 died here with "Committer identity unknown").
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.ver.outputs.tag }}"
          PREV="${{ steps.changes.outputs.prev }}"
          RANGE="${PREV:+$PREV..}HEAD"
          {
            echo "Prerelease cut manually from ${GITHUB_REF_NAME} for early testing; stable releases are published separately."
            echo
            echo "## Commits since ${PREV:-repository start}"
            echo '```'
            git log --oneline "$RANGE"
            echo '```'
          } > notes.md
          git tag -a "$TAG" -m "$TAG (prerelease from ${GITHUB_REF_NAME})"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TAG"
          gh release create "$TAG" --prerelease \
            --title "${GITHUB_REPOSITORY#*/} $TAG" \
            --notes-file notes.md \
            dist/*
